name: mediakit

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mediakit_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mediakit}
      MYSQL_USER: ${MYSQL_USER:-mediakit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mediakit_pw}
    ports:
      - "${MYSQL_PORT:-3316}:3306"
    volumes:
      - mediakit_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mediakit_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - mediakit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mediakit_mysql:
  mediakit_redis:

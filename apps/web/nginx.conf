server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # client max body covers /uploads of large images (local driver)
    client_max_body_size 10m;

    # Mirror the Vite dev proxy: API + uploads to the api container.
    # __API_UPSTREAM__ is replaced at container start by nginx-init.sh:
    #   default campaignreport-server:4000 (docker-compose service name);
    #   K8s deploys set API_UPSTREAM=<service>.<ns>.svc.cluster.local:4000.
    location /api/ {
        proxy_pass http://__API_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI HTML 生成(DeepSeek/GLM 推理模型)需要 2-3 分钟,偶发更久。
        # nginx 默认 proxy_read_timeout=60s,会在生成完成前直接返回 504
        # (前端只看到 "Request failed with status code 504")。
        # 设 300s:略大于 server 端 fetch 的 290s 主动 abort,且对齐前端 axios 300s。
        # 这样永远是 server 自己的 JSON 响应(成功 200 / 友好 500)先到,
        # 而不是 nginx 裸 504。三个超时按 290s < 300s = 300s 级联。
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location /uploads/ {
        proxy_pass http://__API_UPSTREAM__;
        proxy_set_header Host $host;
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

  document.getElementById('templateOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeTemplateOverlay();
  });

  // Background button
  document.getElementById('bgBtn').addEventListener('click', function() {
    document.getElementById('bgFileInput').click();
  });
  document.getElementById('bgFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      setCanvasBackground(ev.target.result);
    };
    reader.readAsDataURL(file);
    this.value = '';
  });

  // Business component library: a semantic layer above text, image and chart primitives.
  const businessBtn = document.getElementById('businessLibraryBtn');
  const businessMenu = document.getElementById('businessMenu');
  businessBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    const open = businessMenu.classList.toggle('open');
    businessBtn.classList.toggle('open', open);
  });
  businessMenu.addEventListener('click', function(e) {
    const item = e.target.closest('[data-business-comp]');
    if (!item) return;
    addBusinessComponent(item.dataset.businessComp);
    businessMenu.classList.remove('open');
    businessBtn.classList.remove('open');
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.business-library')) {
      businessMenu.classList.remove('open');
      businessBtn.classList.remove('open');
    }
  });

  // Component toolbar buttons
  document.querySelectorAll('.comp-toolbar .btn[data-comp]').forEach(btn => {
    btn.addEventListener('click', function() {
      // Toggle active
      document.querySelectorAll('.comp-toolbar .btn[data-comp]').forEach(b => b.classList.remove('active-tool'));
      this.classList.add('active-tool');
      addComponent(this.dataset.comp);
      setTimeout(() => this.classList.remove('active-tool'), 1000);
    });
  });

  // Page list delegation
  document.getElementById('pageList').addEventListener('click', function(e) {
    const thumb = e.target.closest('.page-thumb');
    if (!thumb) return;

    // Page action buttons
    const actionBtn = e.target.closest('.page-thumb-action');
    if (actionBtn) {
      e.stopPropagation();
      const pageId = actionBtn.dataset.pageId;
      if (actionBtn.dataset.action === 'delete') {
        deletePage(pageId);
      }
      if (actionBtn.dataset.action === 'copy') {
        copyPage(pageId);
      }
      return;
    }

    // Switch page
    const pageId = thumb.dataset.pageId;
    if (pageId && pageId !== state.currentPageId) {
      state.currentPageId = pageId;
      state.selectedComponentIds = [];
      pushHistory();
      renderPageList();
      renderCanvas();
      updatePanel();
      fitCanvasToViewport();
    }
  });

  // Page name editing
  document.getElementById('pageList').addEventListener('dblclick', function(e) {
    const nameEl = e.target.closest('.page-thumb-name');
    if (nameEl) {
      nameEl.focus();
      // Select all text
      const range = document.createRange();
      range.selectNodeContents(nameEl);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });

  // Page name save on blur
  document.getElementById('pageList').addEventListener('blur', function(e) {
    const nameEl = e.target.closest('.page-thumb-name');
    if (nameEl) {
      const pageId = nameEl.closest('.page-thumb').dataset.pageId;
      const page = state.pages.find(p => p.id === pageId);
      if (page) {
        page.name = nameEl.textContent.trim() || page.name;
        pushHistory();
        renderPageList();
      }
    }
  }, true);

  // Page name Enter to save
  document.getElementById('pageList').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const nameEl = e.target.closest('.page-thumb-name');
      if (nameEl) { e.preventDefault(); nameEl.blur(); }
    }
  });

  // Drag and drop page reorder
  let dragPageId = null;
  document.getElementById('pageList').addEventListener('dragstart', function(e) {
    const thumb = e.target.closest('.page-thumb');
    if (!thumb) return;
    dragPageId = thumb.dataset.pageId;
    thumb.style.opacity = '0.5';
  });
  document.getElementById('pageList').addEventListener('dragend', function(e) {
    const thumb = e.target.closest('.page-thumb');
    if (thumb) thumb.style.opacity = '1';
    dragPageId = null;
  });
  document.getElementById('pageList').addEventListener('dragover', function(e) {
    e.preventDefault();
  });
  document.getElementById('pageList').addEventListener('drop', function(e) {
    e.preventDefault();
    const targetThumb = e.target.closest('.page-thumb');
    if (!targetThumb || !dragPageId || dragPageId === targetThumb.dataset.pageId) return;

    const fromIdx = state.pages.findIndex(p => p.id === dragPageId);
    const toIdx = state.pages.findIndex(p => p.id === targetThumb.dataset.pageId);
    if (fromIdx < 0 || toIdx < 0) return;

    const [moved] = state.pages.splice(fromIdx, 1);
    state.pages.splice(toIdx, 0, moved);
    pushHistory();
    renderPageList();
    showToast('页面顺序已更新');
  });

  // Context menu - close on click outside
  document.addEventListener('click', function(e) {
    const menu = document.getElementById('contextMenu');
    if (!menu.contains(e.target)) {
      menu.classList.remove('visible');
    }
  });

  // Property panel input bindings
  document.getElementById('panelInner').addEventListener('change', function(e) {
    const input = e.target.closest('[data-comp-prop]');
    if (!input) return;
    const prop = input.dataset.compProp;
    const selected = getSelectedComponents();
    if (selected.length !== 1) return;
    // Handle JSON fields
    if (prop === 'barsJson') {
      try {
        selected[0].data.bars = JSON.parse(input.value);
      } catch (err) {
        showToast('JSON 格式错误，请检查');
        return;
      }
    } else if (prop === 'headersJson') {
      try {
        selected[0].data.headers = JSON.parse(input.value);
      } catch (err) {
        showToast('JSON 格式错误，请检查');
        return;
      }
    } else if (prop === 'rowsJson') {
      try {
        selected[0].data.rows = JSON.parse(input.value);
      } catch (err) {
        showToast('JSON 格式错误，请检查');
        return;
      }
    } else {
      selected[0].data[prop] = input.value;
    }
    pushHistory();
    renderCanvas();
  });
}

// ===== Background =====
function setCanvasBackground(imageSrc) {
  const page = getCurrentPage();
  if (!page) return;
  // Remove existing background
  page.components = page.components.filter(c => c.type !== 'canvas-bg');
  // Create new background at layer 0
  const bgComp = {
    id: 'comp-bg-' + Date.now(),
    type: 'canvas-bg',
    x: 0, y: 0,
    w: state.canvasWidth,
    h: state.canvasHeight,
    data: { src: imageSrc, locked: true },
  };
  page.components.unshift(bgComp);
  pushHistory();
  renderCanvas();
  showToast('背景已更新');
}

// ===== Page Operations =====
let _deletingPage = false;
function deletePage(pageId) {
  if (_deletingPage) return;
  if (state.pages.length <= 1) {
    showToast('至少保留一个页面');
    return;
  }
  _deletingPage = true;
  const idx = state.pages.findIndex(p => p.id === pageId);
  if (idx < 0) { _deletingPage = false; return; }
  state.pages.splice(idx, 1);
  if (state.currentPageId === pageId) {
    state.currentPageId = state.pages[0].id;
  }
  state.selectedComponentIds = [];
  pushHistory();
  renderPageList();
  renderCanvas();
  fitCanvasToViewport();
  updatePanel();
  showToast('已删除页面');
  setTimeout(function() { _deletingPage = false; }, 300);
}

function copyPage(pageId) {
  const orig = state.pages.find(p => p.id === pageId);
  if (!orig) return;
  const newPage = {
    id: 'p-' + Date.now(),
    name: orig.name + ' (副本)',
    components: JSON.parse(JSON.stringify(orig.components)),
  };
  newPage.components.forEach(c => c.id = 'comp-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5));
  state.pages.push(newPage);
  pushHistory();
  renderPageList();
  showToast('已复制页面');
}

function renderTemplateGrid() {
  const grid = document.getElementById('templateGrid');
  let html = '';
  for (let i = 0; i < TEMPLATES.length; i += 3) {
    html += '<div class="template-row">';
    for (let j = i; j < i + 3 && j < TEMPLATES.length; j++) {
      const t = TEMPLATES[j];
      html += `
        <div class="template-card${t.available ? ' active-template' : ' locked'}" data-template-idx="${j}">
          <div class="template-card-icon">${t.icon}</div>
          ${t.name ? `<div class="template-card-name">${t.name}</div>` : `<div class="template-card-name">${t.name1}</div><div class="template-card-subname">${t.name2}</div>`}
          <div class="template-badge ${t.available ? 'available' : 'locked'}">
            ${t.available ? '<span class="badge-icon">✓</span> 可用' : '<span class="badge-icon">🔒</span> 即将上线'}
          </div>
        </div>`;
    }
    html += '</div>';
  }
  grid.innerHTML = html;

  // Card click
  grid.querySelectorAll('.template-card').forEach(card => {
    card.addEventListener('click', function() {
      const idx = parseInt(this.dataset.templateIdx);
      const t = TEMPLATES[idx];
      if (!t.available) {
        showToast('该模板即将上线，敬请期待');
        return;
      }
      // Apply template
      const newPage = {
        id: 'p-' + Date.now(),
        name: t.name || (t.name1 + t.name2),
        components: JSON.parse(JSON.stringify(TEMPLATE_COMPONENTS)),
      };
      newPage.components.forEach(c => c.id = 'comp-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5));
      state.pages.push(newPage);
      state.currentPageId = newPage.id;
      state.selectedComponentIds = [];
      pushHistory();
      renderPageList();
      renderCanvas();
      fitCanvasToViewport();
      updatePanel();
      closeTemplateOverlay();
      document.getElementById('templateOverlay').classList.add('hidden');
      showToast('已应用模板：' + (t.name || (t.name1 + t.name2)));
    });
  });
}

// ===== Context Menu =====
function showContextMenu(x, y, comp) {
  const menu = document.getElementById('contextMenu');
  const isLocked = comp.data && comp.data.locked;

  menu.innerHTML = `
    <button class="context-menu-item" data-action="copy">📋 复制</button>
    <button class="context-menu-item" data-action="cut">✂️ 剪切</button>
    <button class="context-menu-item danger" data-action="delete">🗑 删除</button>
    <div class="context-menu-separator"></div>
    <button class="context-menu-item" data-action="layer-up">⬆ 上移一层</button>
    <button class="context-menu-item" data-action="layer-down">⬇ 下移一层</button>
    <button class="context-menu-item" data-action="layer-top">⬆⬆ 置顶</button>
    <button class="context-menu-item" data-action="layer-bottom">⬇⬇ 置底</button>
    <div class="context-menu-separator"></div>
    <button class="context-menu-item" data-action="lock">${isLocked ? '🔓 解锁位置' : '🔒 锁定位置'}</button>
  `;

  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('visible');

  // Menu item actions
  menu.querySelectorAll('.context-menu-item').forEach(item => {
    item.addEventListener('click', function() {
      const action = this.dataset.action;
      handleContextAction(action, comp);
      menu.classList.remove('visible');
    });
  });
}

function handleContextAction(action, comp) {
  const page = getCurrentPage();
  switch (action) {
    case 'copy':
      duplicateComponent(comp.id);
      break;
    case 'cut':
      state.clipboard = [JSON.parse(JSON.stringify(comp))];
      deleteComponent(comp.id);
      showToast('已剪切组件');
      break;
    case 'delete':
      deleteComponent(comp.id);
      break;
    case 'layer-up': {
      const idx = page.components.indexOf(comp);
      if (idx < page.components.length - 1) {
        page.components.splice(idx, 1);
        page.components.splice(idx + 1, 0, comp);
        pushHistory();
        renderCanvas();
      }
      break;
    }
    case 'layer-down': {
      const idx = page.components.indexOf(comp);
      if (idx > 0) {
        page.components.splice(idx, 1);
        page.components.splice(idx - 1, 0, comp);
        pushHistory();
        renderCanvas();
      }
      break;
    }
    case 'layer-top':
      page.components = page.components.filter(c => c.id !== comp.id).concat(comp);
      pushHistory();
      renderCanvas();
      break;
    case 'layer-bottom':
      page.components = [comp].concat(page.components.filter(c => c.id !== comp.id));
      pushHistory();
      renderCanvas();
      break;
    case 'lock':
      comp.data.locked = !comp.data.locked;
      if (comp.data.locked) {
        state.selectedComponentIds = state.selectedComponentIds.filter(id => id !== comp.id);
        updatePanel();
      }
      pushHistory();
      renderCanvas();
      showToast(comp.data.locked ? '已锁定组件位置' : '已解锁组件位置');
      break;
  }
}

// ===== Data Source Selects (Metric, Creator, Creator Data) =====
const DS_METRICS = ['总GMV', '总点击量', 'CPA', '转化率', '新客率'];
const CREATORS = [
  { id: '2212', name: '小何静子' },
  { id: '3344', name: '鱼鱼' },
  { id: '345577', name: '豆豆' },
];
const CREATOR_DATA_OPTIONS = ['粉丝量', '作品'];

function initCustomSelect(container, selectId, options, opts) {
  const { isObject, showId, onSelect, selectedValue } = opts || {};
  const trigger = container.querySelector('#' + selectId + 'Trigger');
  const dropdown = container.querySelector('#' + selectId + 'Dropdown');
  const searchInput = container.querySelector('#' + selectId + 'Search');
  const optionsContainer = container.querySelector('#' + selectId + 'Options');
  if (!trigger || !dropdown) return;

  function getLabel(opt) {
    if (isObject) return showId ? (opt.id + '/' + opt.name) : opt.name;
    return opt;
  }

  function filterOptions(q) {
    const query = (q || '').toLowerCase().trim();
    if (!query) return options;
    return options.filter(opt => {
      const label = getLabel(opt).toLowerCase();
      if (isObject) return label.includes(query) || String(opt.id).includes(query);
      return label.includes(query);
    });
  }

  function renderOptions(filter) {
    const filtered = filterOptions(filter);
    if (filtered.length === 0) {
      optionsContainer.innerHTML = '<div class="custom-select-no-results">无匹配结果</div>';
    } else {
      optionsContainer.innerHTML = filtered.map(opt => {
        const label = getLabel(opt);
        const optId = isObject ? opt.id : null;
        const isSel = isObject ? (selectedValue && selectedValue().id === optId) : (selectedValue && selectedValue() === opt);
        return `
          <div class="custom-select-option${isSel ? ' selected' : ''}" data-value="${isObject ? optId : opt}">
            ${isObject && showId ? `<span class="option-id">${opt.id}</span>` : ''}
            <span>${label}</span>
          </div>`;
      }).join('');
    }

    optionsContainer.querySelectorAll('.custom-select-option').forEach(opt => {
      opt.addEventListener('click', function(e) {
        e.stopPropagation();
        const val = this.dataset.value;
        let selected;
        if (isObject) {
          selected = options.find(o => String(o.id) === String(val));
        } else {
          selected = val;
        }
        if (onSelect) onSelect(selected);
        dropdown.classList.remove('open');
        trigger.classList.remove('open');
      });
    });
  }

  // Toggle
  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    const isOpen = dropdown.classList.contains('open');
    // Close all other custom selects
    container.querySelectorAll('.custom-select-dropdown.open').forEach(d => d.classList.remove('open'));
    container.querySelectorAll('.custom-select-trigger.open').forEach(t => t.classList.remove('open'));
    if (!isOpen) {
      dropdown.classList.add('open');
      trigger.classList.add('open');
      renderOptions(searchInput ? searchInput.value : '');
      if (searchInput) searchInput.focus();
    }
  });

  // Search
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      renderOptions(this.value);
    });
  }

  // Initial render
  renderOptions('');
}

function initDataSourceSelects(container, comp) {
  const d = comp.data || {};

  // 1. Data source metric select
  initCustomSelect(container, 'dsMetric', DS_METRICS, {
    isObject: false,
    selectedValue: function() { return (comp.data && comp.data.dsMetric) || null; },
    onSelect: function(val) {
      if (!comp.data) comp.data = {};
      comp.data.dsMetric = val;
      updateTriggerLabel(container, 'dsMetric', val);
      renderCanvas();
    }
  });

  // 2. Creator select
  initCustomSelect(container, 'creator', CREATORS, {
    isObject: true,
    showId: true,
    selectedValue: function() { return (comp.data && comp.data.creator) || null; },
    onSelect: function(val) {
      if (!comp.data) comp.data = {};
      comp.data.creator = val;
      updateTriggerLabel(container, 'creator', val ? val.id + '/' + val.name : null);
      // Show/hide creator data section
      const cds = container.querySelector('#creatorDataSection');
      if (cds) cds.style.display = val ? 'block' : 'none';
      if (!val) {
        comp.data.creatorData = null;
        updateTriggerLabel(container, 'creatorData', null);
      }
      renderCanvas();
    }
  });

  // 3. Creator data select
  initCustomSelect(container, 'creatorData', CREATOR_DATA_OPTIONS, {
    isObject: false,
    selectedValue: function() { return (comp.data && comp.data.creatorData) || null; },
    onSelect: function(val) {
      if (!comp.data) comp.data = {};
      comp.data.creatorData = val;
      updateTriggerLabel(container, 'creatorData', val);
      renderCanvas();
    }
  });
}

function updateTriggerLabel(container, selectId, value) {
  const trigger = container.querySelector('#' + selectId + 'Trigger');
  if (!trigger) return;
  const span = trigger.querySelector('span:not(.arrow)');
  if (!span) return;
  if (value) {
    span.textContent = value;
    span.classList.remove('custom-select-placeholder');
  } else {
    const placeholders = {
      dsMetric: '请选择数据源',
      creator: '请选择达人',
      creatorData: '请选择达人数据',
    };
    span.textContent = placeholders[selectId] || '请选择';
    span.classList.add('custom-select-placeholder');
  }
}

function initCpsSelect(container, comp) {

  const dropdown = container.querySelector('#cpsDropdown');
  const searchInput = container.querySelector('#cpsSearchInput');
  const optionsContainer = container.querySelector('#cpsOptions');

  function getSelectedCps() {
    return (comp.data && comp.data.cpsPlans) ? comp.data.cpsPlans : [];
  }

  function setSelectedCps(plans) {
    if (!comp.data) comp.data = {};
    comp.data.cpsPlans = plans;
  }

  function renderCpsTrigger() {
    const selected = getSelectedCps();
    if (selected.length === 0) {
      trigger.innerHTML = '<span class="cps-placeholder">请选择 CPS 计划</span>';
    } else {
      trigger.innerHTML = selected.map(cp =>
        `<span class="cps-tag" data-cps-id="${cp.id}">${cp.id}/${cp.name}<span class="cps-tag-remove" data-cps-id="${cp.id}">×</span></span>`
      ).join('');
    }

    trigger.querySelectorAll('.cps-tag-remove').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const cpsId = this.dataset.cpsId;
        const plans = getSelectedCps().filter(c => c.id !== cpsId);
        setSelectedCps(plans);
        renderCpsTrigger();
        renderCpsOptions();
        renderCanvas();
      });
    });
  }

  function renderCpsOptions(filter) {
    const selected = getSelectedCps();
    const selectedIds = selected.map(s => s.id);
    const q = (filter || '').toLowerCase().trim();

    let filtered = CPS_PLANS;
    if (q) {
      filtered = CPS_PLANS.filter(cp =>
        cp.id.toLowerCase().includes(q) || cp.name.toLowerCase().includes(q)
      );
    }

    if (filtered.length === 0) {
      optionsContainer.innerHTML = '<div class="cps-no-results">无匹配结果</div>';
    } else {
      optionsContainer.innerHTML = filtered.map(cp => `
        <div class="cps-option${selectedIds.includes(cp.id) ? ' selected' : ''}" data-cps-id="${cp.id}">
          <input type="checkbox" ${selectedIds.includes(cp.id) ? 'checked' : ''}>
          <span class="cps-option-id">${cp.id}</span>
          <span class="cps-option-name">${cp.name}</span>
        </div>
      `).join('');
    }

    optionsContainer.querySelectorAll('.cps-option').forEach(opt => {
      opt.addEventListener('click', function(e) {
        e.stopPropagation();
        const cpsId = this.dataset.cpsId;
        const plan = CPS_PLANS.find(c => c.id === cpsId);
        if (!plan) return;
        let plans = getSelectedCps();
        const existingIdx = plans.findIndex(c => c.id === cpsId);
        if (existingIdx >= 0) {
          plans = plans.filter(c => c.id !== cpsId);
        } else {
          plans = [...plans, plan];
        }
        setSelectedCps(plans);
        renderCpsTrigger();
        renderCpsOptions(searchInput.value);
        renderCanvas();
      });
    });
  }

  // Toggle dropdown
  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    const isOpen = dropdown.classList.contains('open');
    if (isOpen) {
      dropdown.classList.remove('open');
    } else {
      dropdown.classList.add('open');
      renderCpsOptions(searchInput.value);
      searchInput.focus();
    }
  });

  // Search input
  searchInput.addEventListener('input', function() {
    renderCpsOptions(this.value);
  });

  // Initial render
  renderCpsTrigger();
  renderCpsOptions();
}

// ===== Preview =====
let previewCurrentPage = 0;
const PREVIEW_W = 960;
const PREVIEW_H = 540;

function updatePreviewPageInfo() {
  previewCurrentPage = state.pages.findIndex(p => p.id === state.currentPageId);
  if (previewCurrentPage < 0) previewCurrentPage = 0;
  renderPreviewPage();
}

function renderPreviewPage() {
  const info = document.getElementById('previewPageInfo');
  const canvas = document.getElementById('previewCanvas');
  const page = state.pages[previewCurrentPage];

  if (!page) {
    info.textContent = '第 0 页 / 共 0 页';
    canvas.innerHTML = '';
    return;
  }

  info.textContent = `第 ${previewCurrentPage + 1} 页 / 共 ${state.pages.length} 页`;

  const scaleX = PREVIEW_W / state.canvasWidth;
  const scaleY = PREVIEW_H / state.canvasHeight;
  const scale = Math.min(scaleX, scaleY);

  let html = '';
  page.components.forEach(comp => {
    html += renderPreviewComponent(comp, scale);
  });
  canvas.innerHTML = html;
}

function renderPreviewComponent(comp, scale) {
  const d = comp.data || {};
  const x = comp.x * scale;
  const y = comp.y * scale;
  const w = comp.w * scale;
  const h = comp.h * scale;

  let inner = '';
  switch (comp.type) {
    case 'text':
      inner = `<div style="width:100%;height:100%;display:flex;flex-direction:column;${d.bgColor ? 'background:' + d.bgColor + ';border-radius:' + ((d.borderRadius || 6) * scale) + 'px;padding:' + ((d.padding || 0) * scale) + 'px;' : ''}${d.bgColor ? 'border:1px solid #F3F4F6;' : ''}">
        <div style="font-family:${d.fontFamily || 'Inter'};font-size:${(d.fontSize || 14) * Math.max(scale, 0.6)}px;font-weight:${d.fontWeight || '400'};color:${d.color || '#1A1A1A'};overflow:hidden;word-break:break-word;">${d.content || '文本内容'}</div>
      </div>`;
      break;
    case 'indicator-card':
      inner = `<div style="width:100%;height:100%;display:flex;flex-direction:column;gap:${2 * scale}px;padding:${12 * scale}px ${14 * scale}px;background:#FFF;border:1px solid #F3F4F6;border-radius:${8 * scale}px;">
        <div style="font-size:${10 * Math.max(scale, 0.6)}px;color:#888;font-weight:500;">${d.title || '指标'}</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:${18 * Math.max(scale, 0.6)}px;font-weight:600;color:#1A1A1A;">${d.value || '---'}</div>
        ${d.trend ? `<div class="card-trend ${d.trendUp ? 'up' : 'down'}" style="font-size:${10 * Math.max(scale, 0.6)}px;"><span>${d.trendUp ? '↑' : '↓'}</span> ${d.trend}</div>` : ''}
      </div>`;
      break;
    case 'bar-chart':
      inner = `<div style="width:100%;height:100%;display:flex;flex-direction:column;gap:${8 * scale}px;padding:${14 * scale}px;background:#FFF;border:1px solid #F3F4F6;border-radius:${8 * scale}px;">
        <div style="font-family:'Funnel Sans',sans-serif;font-size:${13 * Math.max(scale, 0.6)}px;font-weight:600;color:#1A1A1A;">${d.title || '柱状图'}</div>
        <div style="flex:1;display:flex;align-items:flex-end;gap:${20 * scale}px;padding-top:${4 * scale}px;">
          ${(d.bars || []).map(b => `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:${4 * scale}px;height:100%;">
              <div style="width:100%;height:${b.value}%;background:${b.color};border-radius:${4 * scale}px ${4 * scale}px 0 0;opacity:0.9;min-height:${4 * scale}px;"></div>
              <div style="font-size:${9 * Math.max(scale, 0.6)}px;color:#888;">${b.label}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
      break;
    case 'table':
      inner = `<div style="width:100%;height:100%;display:flex;flex-direction:column;background:#FFF;border:1px solid #F3F4F6;border-radius:${8 * scale}px;overflow:hidden;">
        <div style="display:flex;height:${34 * scale}px;background:#F9FAFB;align-items:center;padding:0 ${14 * scale}px;border-bottom:1px solid #F3F4F6;">
          ${(d.headers || []).map((hdr, i) => `<div style="flex:1;font-size:${10 * Math.max(scale, 0.6)}px;font-weight:600;color:#666;text-align:${i === 0 ? 'left' : 'right'};">${hdr}</div>`).join('')}
        </div>
        ${(d.rows || []).map((row, ri) => `
          <div style="display:flex;height:${34 * scale}px;align-items:center;padding:0 ${14 * scale}px;${ri < (d.rows || []).length - 1 ? 'border-bottom:1px solid #F3F4F6;' : ''}">
            ${row.map((cell, ci) => `<div style="flex:1;font-size:${11 * Math.max(scale, 0.6)}px;font-family:${ci === 0 ? 'Inter' : 'IBM Plex Mono'},monospace;font-weight:${ci === 0 ? '500' : '400'};color:#1A1A1A;text-align:${ci === 0 ? 'left' : 'right'};">${cell}</div>`).join('')}
          </div>
        `).join('')}
      </div>`;
      break;
    case 'line-chart':
      inner = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#FFF;border:1px solid #F3F4F6;border-radius:${8 * scale}px;color:#888;font-size:${12 * Math.max(scale, 0.6)}px;">📈 折线图组件</div>`;
      break;
    case 'pie-chart':
      inner = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#FFF;border:1px solid #F3F4F6;border-radius:${8 * scale}px;color:#888;font-size:${12 * Math.max(scale, 0.6)}px;">🥧 饼图组件</div>`;
      break;
    case 'image':
      inner = d.src
        ? `<img src="${d.src}" style="width:100%;height:100%;object-fit:cover;" alt="">`
        : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#F9FAFB;border:1px dashed #E5E7EB;border-radius:${8 * scale}px;color:#888;font-size:${12 * Math.max(scale, 0.6)}px;">🖼 图片</div>`;
      break;
    case 'business-block':
      inner = renderBusinessBlock(d, scale);
      break;
    case 'canvas-bg':
      inner = d.src ? `<img src="${d.src}" style="width:100%;height:100%;object-fit:cover;" draggable="false" alt="">` : '';
      break;
    default:
      inner = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#F9FAFB;border:1px dashed #E5E7EB;border-radius:${8 * scale}px;color:#888;font-size:${12 * Math.max(scale, 0.6)}px;">${comp.type}</div>`;
  }

  return `<div class="preview-component" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;">${inner}</div>`;
}

function previewPrevPage() {
  if (previewCurrentPage > 0) {
    previewCurrentPage--;
    renderPreviewPage();
  }
}

function previewNextPage() {
  if (previewCurrentPage < state.pages.length - 1) {
    previewCurrentPage++;
    renderPreviewPage();
  }
}

// ===== Toast =====
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== Init =====
init();
</script>
